    function getInitialLanguage() {
        const saved = localStorage.getItem(LANGUAGE_STORAGE_KEY);
        if (saved === "zh" || saved === "en") return saved;
        return navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
    }

    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function randomCuteLineIndex() {
        return Math.floor(Math.random() * cuteLines.length);
    }

    function randomValidationLineIndex() {
        return Math.floor(Math.random() * validationLines.length);
    }

    function parseUserIds(value) {
        return Array.from(new Set(value.split(/[\s,，]+/).map(item => item.trim()).filter(Boolean)));
    }

    async function readResponse(response) {
        const text = await response.text();
        let body = text;
        try {
            body = JSON.parse(text);
        } catch {
            body = text;
        }
        return {status: response.status, body};
    }

    async function postJson(uid, url, body) {
        const response = await fetch(url, {
            method: "POST",
            headers: {
                Accept: "application/json, text/plain, */*",
                "Content-Type": "application/json",
                Usertoken: uid,
            },
            body: JSON.stringify(body),
        });
        return readResponse(response);
    }

    async function getJson(uid, url) {
        const response = await fetch(url, {
            method: "GET",
            headers: {
                Accept: "application/json, text/plain, */*",
                Usertoken: uid,
            },
        });
        return readResponse(response);
    }

    function isSuccessBody(body) {
        if (!body || typeof body !== "object") return false;
        if (Object.prototype.hasOwnProperty.call(body, "code")) return body.code === 0;
        if (Object.prototype.hasOwnProperty.call(body, "shopConfig")) return true;
        return false;
    }

    function formatResponse(result) {
        if (result.body && typeof result.body === "object" && Array.isArray(result.body.shopConfig)) {
            const parts = [`shopConfig: ${result.body.shopConfig.length} items`];
            if (result.body.lid !== undefined) parts.push(`lid: ${result.body.lid}`);
            if (result.body.score !== undefined) parts.push(`score: ${result.body.score}`);
            return `HTTP ${result.status} ${parts.join(", ")}`;
        }

        const body = typeof result.body === "string" ? result.body : JSON.stringify(result.body);
        return `HTTP ${result.status} ${body}`;
    }

        const [status, setStatus] = useState({state: "idle", key: "ready", params: {}});

        const resultsListRef = useRef(null);
        const resultsEndRef = useRef(null);
        const previousResultCountRef = useRef(0);

        const t = useMemo(() => {
            return (key, params = {}) => {
                const template = translations[language][key] || translations.en[key] || key;
                return template.replace(/\{(\w+)\}/g, (_, name) => params[name] ?? "");
            };
        }, [language]);

        useEffect(() => {
            document.documentElement.lang = language === "zh" ? "zh-Hant" : "en";
            localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
        }, [language]);

        useEffect(() => {
            if (!busy || results.length <= previousResultCountRef.current) {
                previousResultCountRef.current = results.length;
                return;
            }

            requestAnimationFrame(() => {
                const isDesktop = window.matchMedia("(min-width: 768px)").matches;
                if (isDesktop && resultsListRef.current) {
                    resultsListRef.current.scrollTo({
                        top: resultsListRef.current.scrollHeight,
                        behavior: "smooth",
                    });
                    return;
                }

                resultsEndRef.current?.scrollIntoView({behavior: "smooth", block: "end"});
            });

            previousResultCountRef.current = results.length;
        }, [busy, results.length]);

        function setLanguage(nextLanguage) {
            setLanguageState(nextLanguage);
        }

        function updateUid(nextUid) {
            setUid(nextUid);
            localStorage.setItem(USER_STORAGE_KEY, nextUid.trim());
        }

        function requireUserIds() {
            const userIds = parseUserIds(uid);
            if (userIds.length === 0) {
                setStatus({state: "bad", key: "missingUserId", params: {}});
                showValidationMessage();
                return [];
            }
            localStorage.setItem(USER_STORAGE_KEY, userIds.join(", "));
            return userIds;
        }

        function showValidationMessage() {
            setResults([]);
            setValidationLineIndex(randomValidationLineIndex());
            previousResultCountRef.current = 0;
            revealResults();
        }

        function revealResults() {
            requestAnimationFrame(() => {
                resultsPanelRef.current?.scrollIntoView({behavior: "smooth", block: "start"});
            });
        }

        function accountLabel(account) {
            return account.name ? `${account.name} · ${account.uid}` : account.uid;
        }

        async function lookupAccount(userId) {
            const id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${userId}-lookup`;
            const fallbackAccount = {uid: userId, name: "", lookupOk: false};
            setResults(previous => [...previous, {
                id,
                accountLabel: userId,
                nameKey: "taskLookupUser",
                method: "POST",
                state: "running",
                detail: t("waiting"),
            }]);

            try {
                const response = await postJson(userId, `${STORE_ORIGIN}/getuserhome.php`, {uid: userId});
                const name = response.body && response.body.info && response.body.info.name ? response.body.info.name : "";
                const ok = response.body && response.body.code === 0;
                const account = {uid: userId, name, lookupOk: ok};
                setResults(previous => previous.map(result => (
                    result.id === id
                        ? {
                            ...result,
                            accountLabel: accountLabel(account),
                            state: ok ? "ok" : "bad",
                            detail: ok ? accountLabel(account) : formatResponse(response),
                        }
                        : result
                )));
                return account;
            } catch (error) {
                setResults(previous => previous.map(result => (
                    result.id === id
                        ? {...result, state: "bad", detail: error.message}
                        : result
                )));
                return fallbackAccount;
            }
        }

        async function runWebsiteTasks() {
            const userIds = requireUserIds();
            if (userIds.length === 0) return;

            setBusy(true);
            setResults([]);
            setValidationLineIndex(null);
            previousResultCountRef.current = 0;
            setStatus({state: "running", key: "runningTasks", params: {}});
            revealResults();

            let okCount = 0;
            const totalCount = userIds.length * (taskDefinitions.length + 1);
            for (const userId of userIds) {
                const account = await lookupAccount(userId);
                if (account.lookupOk) okCount += 1;

                for (const task of taskDefinitions) {
                    const id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${account.uid}-${task.nameKey}`;
                    const pendingResult = {
                        id,
                        accountLabel: accountLabel(account),
                        nameKey: task.nameKey,
                        method: task.method,
                        state: "running",
                        detail: t("waiting"),
                    };
                    setResults(previous => [...previous, pendingResult]);

                    try {
                        const response = await postJson(account.uid, task.url, task.body(account.uid));
                        const ok = isSuccessBody(response.body);
                        if (ok) {
                            okCount += 1;
                            celebrate();
                        }
                        setResults(previous => previous.map(result => (
                            result.id === id
                                ? {...result, state: ok ? "ok" : "bad", detail: formatResponse(response)}
                                : result
                        )));
                    } catch (error) {
                        setResults(previous => previous.map(result => (
                            result.id === id
                                ? {...result, state: "bad", detail: error.message}
                                : result
                        )));
                    }

                    await wait(450);
                }
            }

            setStatus({
                state: okCount === totalCount ? "ok" : "bad",
                key: "done",
                params: {ok: okCount, total: totalCount},
            });
            setBusy(false);
        }

        async function redeemGiftCode() {
            const userIds = requireUserIds();
            const cleanCode = giftCode.trim();
            if (userIds.length === 0) return;
            if (!cleanCode) {
                setStatus({state: "bad", key: "missingInput", params: {}});
                showValidationMessage();
                return;
            }

            setBusy(true);
            setResults([]);
            setValidationLineIndex(null);
            previousResultCountRef.current = 0;
            setStatus({state: "running", key: "redeeming", params: {}});
            revealResults();

            let okCount = 0;
            const totalCount = userIds.length * 2;
            for (const userId of userIds) {
                const account = await lookupAccount(userId);
                if (account.lookupOk) okCount += 1;

                const url = new URL(`${GIFT_ORIGIN}/code.php`);
                url.searchParams.set("uid", account.uid);
                url.searchParams.set("code", cleanCode);

                const id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${account.uid}-gift`;
                setResults(previous => [...previous, {
                    id,
                    accountLabel: accountLabel(account),
                    nameKey: "taskRedeemGift",
                    method: "GET",
                    state: "running",
                    detail: t("waiting"),
                }]);

                try {
                    const response = await getJson(account.uid, url.toString());
                    const ok = response.body && response.body.errorCode === "ok";
                    if (ok) {
                        okCount += 1;
                        celebrate();
                    }
                    setResults(previous => previous.map(result => (
                        result.id === id
                            ? {...result, state: ok ? "ok" : "bad", detail: formatResponse(response)}
                            : result
                    )));
                } catch (error) {
                    setResults(previous => previous.map(result => (
                        result.id === id ? {...result, state: "bad", detail: error.message} : result
                    )));
                }

                await wait(450);
            }

            setStatus({state: okCount === totalCount ? "ok" : "bad", key: okCount === totalCount ? "redeemed" : "failed", params: {}});
            setBusy(false);
        }

        async function buyOrangeGear() {
            const userIds = requireUserIds();
            if (userIds.length === 0) return;

            setBusy(true);
            setResults([]);
            setValidationLineIndex(null);
            previousResultCountRef.current = 0;
            setStatus({state: "running", key: "buyingOrangeGear", params: {}});
            revealResults();

            const task = manualActions.buyOrangeGear;
            let okCount = 0;
            const totalCount = userIds.length * 2;
            for (const userId of userIds) {
                const account = await lookupAccount(userId);
                if (account.lookupOk) okCount += 1;

                const id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${account.uid}-${task.nameKey}`;
                setResults(previous => [...previous, {
                    id,
                    accountLabel: accountLabel(account),
                    nameKey: task.nameKey,
                    method: task.method,
                    state: "running",
                    detail: t("waiting"),
                }]);

                try {
                    const response = await postJson(account.uid, task.url, task.body(account.uid));
                    const ok = isSuccessBody(response.body);
                    if (ok) {
                        okCount += 1;
                        celebrate();
                    }
                    setResults(previous => previous.map(result => (
                        result.id === id
                            ? {...result, state: ok ? "ok" : "bad", detail: formatResponse(response)}
                            : result
                    )));
                } catch (error) {
                    setResults(previous => previous.map(result => (
                        result.id === id ? {...result, state: "bad", detail: error.message} : result
                    )));
                }

                await wait(450);
            }

            setStatus({state: okCount === totalCount ? "ok" : "bad", key: okCount === totalCount ? "boughtOrangeGear" : "failed", params: {}});
            setBusy(false);
        }

        return h("main", {className: "mx-auto w-[min(1120px,calc(100vw-32px))] py-7 text-ink md:py-9"},
            h("header", {className: "flex min-h-[52px] flex-col gap-4 border-b border-line pb-4 md:flex-row md:items-center md:justify-between"},
                h("div", {className: "flex min-w-0 items-center gap-3"},
                    h("div", {className: "grid h-[46px] w-[46px] animate-catWiggle place-items-center overflow-hidden rounded-lg bg-brandSoft shadow-soft"},
                        h("img", {
                            src: "image.png",
                            alt: "",
                            className: "h-full w-full object-cover",
                            "aria-hidden": true,
                        }),
                    ),
                    h("div", null,
                        h("h1", {className: "m-0 flex items-center gap-2 text-[clamp(20px,3vw,28px)] font-black leading-none tracking-normal"},
                            "LastZ Task Runner",
                            h(Icon, {icon: "mdi:paw", className: "h-5 w-5 text-brand"}),
                        ),
                        h("p", {className: "mt-1 text-sm text-muted"}, t("subtitle")),
                    ),
                ),
                h("div", {className: "flex flex-wrap items-center justify-between gap-2 md:justify-end"},
                    h("div", {
                            className: "grid min-h-[34px] grid-cols-2 overflow-hidden rounded-full border border-line bg-white/60",
                            "aria-label": "Language"
                        },
                        ["zh", "en"].map(option => h("button", {
                            key: option,
                            type: "button",
                            className: `min-w-[52px] px-3 text-sm font-extrabold ${language === option ? "bg-brand text-white" : "text-muted"}`,
                            "aria-pressed": String(language === option),
                            onClick: () => setLanguage(option),
                        }, option === "zh" ? "中文" : "EN")),
                    ),
                    h("div", {className: "inline-flex min-h-[34px] items-center gap-2 rounded-full border border-line bg-white/60 px-3 text-muted"},
                        h("span", {className: `h-2 w-2 rounded-full ${status.state === "bad" ? "bg-danger" : status.state === "idle" ? "bg-muted" : "bg-brand"}`}),
                        h("span", null, t(status.key, status.params)),
                    ),
                ),
            ),
            h("section", {
                    className: "mt-6 grid items-start gap-[18px] md:grid-cols-[minmax(280px,380px)_minmax(0,1fr)]",
                    "aria-label": "LastZ controls"
                },
                h(Panel, {title: t("controls")},
                    h("div", {className: "grid gap-4 p-[18px]"},
                        h(Field, {label: t("userId"), htmlFor: "uidInput"},
                            h("textarea", {
                                id: "uidInput",
                                name: "uid",
                                inputMode: "numeric",
                                autoComplete: "off",
                                rows: 2,
                                placeholder: "1010432087000136 1582098058000136",
                                value: uid,
                                onChange: event => updateUid(event.target.value),
                                className: `${inputClassName} min-h-[72px] resize-y py-2 leading-relaxed`,
                            }),
                            h("p", {className: "text-xs font-bold leading-relaxed text-muted"}, t("userIdHelp")),
                        ),
                        h(Field, {label: t("giftCode"), htmlFor: "giftCodeInput"},
                            h("input", {
                                id: "giftCodeInput",
                                name: "giftCode",
                                autoComplete: "off",
                                placeholder: "CELEBRATE300K",
                                value: giftCode,
                                onChange: event => setGiftCode(event.target.value),
                                className: inputClassName,
                            }),
                        ),
                        h("div", {className: "grid gap-2.5"},
                            h("button", {
                                type: "button",
                                disabled: busy,
                                onClick: runWebsiteTasks,
                                className: primaryButtonClassName,
                            }, h(Icon, {icon: "mdi:paw"}), h("span", null, t("runTasks"))),
                            h("button", {
                                type: "button",
                                disabled: busy,
                                onClick: redeemGiftCode,
                                className: secondaryButtonClassName,
                            }, h(Icon, {icon: "solar:gift-bold"}), h("span", null, t("redeemGift"))),
                            h("button", {
                                type: "button",
                                disabled: busy,
                                onClick: buyOrangeGear,
                                className: secondaryButtonClassName,
                            }, h(Icon, {icon: "solar:bag-4-bold"}), h("span", null, t("buyOrangeGear"))),
                            h("p", {className: "flex items-center justify-center gap-1.5 text-center text-xs font-bold text-muted"},
                                h(Icon, {icon: "fa6-solid:cat", className: "h-4 w-4 text-brand"}),
                                cuteLines[cuteLineIndex][language],
                            ),
                        ),
                    ),
                ),
                h("div", {ref: resultsPanelRef},
                    h(Panel, {title: t("results"), meta: t("itemCount", {count: results.length})},
                        h("div", {
                                ref: resultsListRef,
                                className: "grid auto-rows-max content-start gap-2 p-[18px] md:max-h-[calc(100vh-180px)] md:min-h-[360px] md:overflow-auto",
                            },
                            results.length === 0
                                ? h(EmptyState, {
                                    label: validationLineIndex === null
                                        ? t("noResults")
                                        : validationLines[validationLineIndex][language],
                                })
                                : results.map(result => h(ResultItem, {
                                    key: result.id,
                                    result,
                                    name: t(result.nameKey),
                                })),
                            h("div", {ref: resultsEndRef, "aria-hidden": true}),
                        ),
                    ),
                ),
            ),
        );
    }

    const inputClassName = "min-h-11 w-full rounded-md border border-line bg-white px-3 text-ink outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15";
    const primaryButtonClassName = "inline-flex min-h-[46px] items-center justify-center gap-2 rounded-md bg-brand px-4 font-extrabold text-white transition hover:-translate-y-0.5 hover:bg-brand/95 disabled:cursor-not-allowed disabled:opacity-55 disabled:hover:translate-y-0";
    const secondaryButtonClassName = "inline-flex min-h-[46px] items-center justify-center gap-2 rounded-md border border-brand/35 bg-brandSoft px-4 font-extrabold text-brand transition hover:-translate-y-0.5 hover:bg-brandSoft/75 disabled:cursor-not-allowed disabled:opacity-55 disabled:hover:translate-y-0";

    function Panel({title, meta, children}) {
        return h("div", {className: "overflow-hidden rounded-lg border border-line bg-white/70 shadow-soft"},
            h("div", {className: "flex items-center justify-between gap-3 border-b border-line bg-panelSoft px-[18px] py-4"},
                h("h2", {className: "m-0 text-base font-extrabold leading-tight tracking-normal"}, title),
                meta ? h("span", {className: "text-xs font-extrabold text-muted"}, meta) : null,
            ),
            children,
        );
    }

    function Field({label, htmlFor, children}) {
        return h("div", {className: "grid gap-2"},
            h("label", {htmlFor, className: "text-[13px] font-bold text-muted"}, label),
            children,
        );
    }

    function EmptyState({label}) {
        return h("div", {className: "grid min-h-80 place-items-center p-8 text-center text-muted"},
            h("div", null,
                h("div", {className: "mx-auto mb-4 grid h-[76px] w-[76px] animate-catFloat place-items-center rounded-lg border border-line bg-brandSoft text-brand"},
                    h(Icon, {icon: "fa6-solid:cat", className: "h-11 w-11"}),
                ),
                h("div", null, label),
            ),
        );
    }

    function ResultItem({result, name}) {
        return h("article", {className: "grid animate-resultIn grid-cols-[28px_minmax(0,1fr)_auto] items-start gap-2.5 rounded-lg border border-line bg-white p-3"},
            h("div", {className: `grid h-[26px] w-[26px] place-items-center rounded-full text-sm font-extrabold text-white ${badgeClass(result.state)}`}, stateIcon(result.state)),
            h("div", null,
                result.accountLabel
                    ? h("p", {className: "mb-1 break-words text-[11px] font-extrabold leading-tight text-brand"}, result.accountLabel)
                    : null,
                h("p", {className: "m-0 text-sm font-extrabold leading-tight"}, name),
                h("p", {className: "mt-1 break-words font-mono text-xs leading-relaxed text-muted"}, result.detail),
            ),
            h("span", {className: "text-xs font-extrabold text-muted"}, result.method),
        );
    }

    function badgeClass(state) {
        if (state === "ok") return "bg-brand";
        if (state === "bad") return "bg-danger";
        return "bg-brand";
    }

    function stateIcon(state) {
        if (state === "ok") return "✓";
        if (state === "bad") return "!";
        return "…";
    }

    createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
