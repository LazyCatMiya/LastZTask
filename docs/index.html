    function getInitialLanguage() {
        const saved = localStorage.getItem(LANGUAGE_STORAGE_KEY);
        if (saved === "zh" || saved === "en") return saved;
        return navigator.language && navigator.language.toLowerCase().startsWith("zh") ? "zh" : "en";
    }

    function getInitialHumanResponse() {
        const saved = localStorage.getItem(HUMAN_RESPONSE_STORAGE_KEY);
        if (saved === "false") return false;
        return true;
    }

    function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));

        return Math.floor(Math.random() * cuteLines.length);

    function randomValidationLineIndex() {
        return Math.floor(Math.random() * validationLines.length);

    function parseUserIds(value) {
        return Array.from(new Set(value.split(/[\s,，]+/).map(item => item.trim()).filter(Boolean)));
    }

    function buildDay7Payload(uid, day = 5, dtype = 0) {
        if (dtype === 0 && day === 1) {
            return {uid, fromkoc: "", day, dtype: 0, lang: "zh-HK"};
        }
        return {uid, day, dtype, lang: "hk"};
    }

    function chooseDay7Rewards(body) {
        const rewards = Array.isArray(body && body.reward) ? body.reward : [];
        const normal = rewards
            .filter(reward => reward && reward.status === 1)
            .map(reward => ({day: Number(reward.day), dtype: 0}));
        const makeup = rewards
            .filter(reward => reward && reward.status === -1)
            .map(reward => ({day: Number(reward.day), dtype: 1}));
        return [...normal, ...makeup];
    }

    function chooseVipLevel(body, fallbackLevel = 1) {
        const vipLevel = Number(body && body.vlevel);
        return Number.isFinite(vipLevel) ? vipLevel : fallbackLevel;
    }

    async function readResponse(response) {
        const text = await response.text();
        let body = text;
        try {
            body = JSON.parse(text);
        } catch {
            body = text;
        }
        return {status: response.status, body};
    }

    async function postJson(uid, url, body) {
        const response = await fetch(url, {
            method: "POST",
            headers: {
                Accept: "application/json, text/plain, */*",
                "Content-Type": "application/json",
                Usertoken: uid,
            },
            body: JSON.stringify(body),
        });
        return readResponse(response);
    }

    async function getJson(uid, url) {
        const response = await fetch(url, {
            method: "GET",
            headers: {
                Accept: "application/json, text/plain, */*",
                Usertoken: uid,
            },
        });
        return readResponse(response);
    }

    function isSuccessBody(body) {
        if (!body || typeof body !== "object") return false;
        if (body.code === 10018 && body.message === "task forever sql fail") return true;
        if (body.code === 10018 && body.message === "week sql fail") return true;
        if (Object.prototype.hasOwnProperty.call(body, "code")) return body.code === 0;
        if (Object.prototype.hasOwnProperty.call(body, "shopConfig")) return true;
        if (Array.isArray(body.rewardWeekConfig) || Array.isArray(body.rewardForeverConfig)) return true;
        return false;
    }

    function translatedLine(language, lines) {
        return lines[language] || lines.en || lines.zh || "";
    }

    function dayLabel(result, language) {
        const day = Number(result.day);
        if (!Number.isFinite(day)) return "";
        return translatedLine(language, {zh: `第 ${day} 天`, en: `Day ${day}`});
    }

    function appendDay(message, result, language) {
        const label = dayLabel(result, language);
        if (!label) return message;
        return language === "zh" ? `${message}${label}` : `${message} ${label}.`;
    }

    function friendlyResponseMessage(result, taskKey, language) {
        if (!result.body || typeof result.body !== "object") return "";

        const code = result.body.code;
        const message = result.body.message;
        if (code === 0) {
            if (taskKey === "taskDay7") return appendDay(translatedLine(language, {zh: "簽到完成！", en: "Check-in complete!"}), result, language);
            if (taskKey === "taskDay7Makeup") return appendDay(translatedLine(language, {zh: "補簽完成！", en: "Makeup check-in complete!"}), result, language);

                taskDay7Done: {zh: "今天簽過了！", en: "Already checked in today!"},
                taskLogin: {zh: "登入完成！", en: "Login task complete!"},
                taskViewUcenter: {zh: "會員中心逛完了！", en: "Member center visited!"},
                taskViewShop: {zh: "商城逛完了！", en: "Shop visited!"},
                taskBuy1000: {zh: "買夠了，任務完成！", en: "Purchase task complete!"},
                taskFirst2000: {zh: "首次 2000 任務完成！", en: "First 2000 task complete!"},
                taskVipWeek: {zh: "每週禮包領到惹！", en: "Weekly package claimed!"},
                taskVipStatus: {zh: "VIP 等級取得完成！", en: "VIP level data loaded!"},
                taskBuyOrangeGear: {zh: "購買完成！", en: "Purchase complete!"},
            };
            if (successMessages[taskKey]) return translatedLine(language, successMessages[taskKey]);
        }
        if (taskKey === "taskRedeemGift" && result.body.errorCode === "ok") return translatedLine(language, {zh: "領取完成！", en: "Claim complete!"});
        if (taskKey === "taskRedeemGift" && result.body.errorCode === "E006" && message === "code already exchanged") return translatedLine(language, {zh: "領過了啦！", en: "Already claimed!"});
        if (taskKey === "taskLookupUser" && code === 10018 && message === "get user fail") return translatedLine(language, {zh: "你沒有名字...", en: "You have no name..."});
        if (taskKey === "taskDay7Status" && Array.isArray(result.body.reward)) return translatedLine(language, {zh: "狀態取得完成！", en: "Status loaded!"});
        if (taskKey === "taskVipStatus" && (Array.isArray(result.body.rewardWeekConfig) || Array.isArray(result.body.rewardForeverConfig))) {
            const vipLevel = result.body.vlevel;
            if (vipLevel !== undefined && vipLevel !== null) {
                return translatedLine(language, {
                    zh: `VIP 等級取得完成！當前 VIP 等級為 ${vipLevel}`,
                    en: `VIP level data loaded! Current VIP level is ${vipLevel}.`,
                });
            }
            return translatedLine(language, {zh: "VIP 等級取得完成！", en: "VIP level data loaded!"});
        }
        if (taskKey === "taskVipWeek" && code === 10018 && message === "week sql fail") return translatedLine(language, {zh: "已領取特權禮包！", en: "VIP package already claimed!"});
        if (taskKey === "taskFirst2000" && code === 10018 && message === "task forever sql fail") return translatedLine(language, {zh: "你已經領過惹！", en: "You already claimed it!"});
        if (code === 10018 && message === "task forever sql fail") return translatedLine(language, {zh: "今天已經領過惹！", en: "Already claimed today!"});

        if ((taskKey === "taskDay7" || taskKey === "taskDay7Makeup") && code === 10002040 && message === "task forever insert fail") return appendDay(translatedLine(language, {zh: "今天已經簽過這天了，", en: "You already checked in for this day."}), result, language);
        if ((taskKey === "taskDay7" || taskKey === "taskDay7Makeup") && code === 10002001 && message === "day fail") return appendDay(translatedLine(language, {zh: "這是明天，所以基本上不該出現！", en: "This is tomorrow, so this basically should not appear!"}), result, language);
        if (taskKey === "taskDay7Makeup" && code === 10002001 && message === "get score fail") return appendDay(translatedLine(language, {zh: "積分不足無法補簽！", en: "Not enough points for makeup check-in!"}), result, language);
        if (taskKey === "taskBuy1000" && code === 10002038 && message === "get task type buy1000 fail") return translatedLine(language, {zh: "你今天還沒買夠！", en: "You have not bought enough today!"});
        if (taskKey === "taskFirst2000" && code === 10002038 && message === "get task type first2000 fail") return translatedLine(language, {zh: "魔法小卡拿出來！", en: "Time to bring out the magic card!"});
        if (taskKey === "taskVipWeek" && code === 10002001 && message === "vip level fail") return translatedLine(language, {zh: "VIP 等級錯誤！", en: "VIP level is incorrect!"});
        if (taskKey === "taskBuyOrangeGear" && code === 10002036 && message === "score fail") return translatedLine(language, {zh: "積分不夠！", en: "Not enough points!"});
        return "";
    }

    function rawResponseText(result) {
        const body = typeof result.body === "string" ? result.body : JSON.stringify(result.body);
        return `HTTP ${result.status} ${body}`;
    }

    function formatResponse(result, taskKey = "", language = "zh", humanResponse = true) {
        if (!humanResponse) return rawResponseText(result);

        const friendlyMessage = friendlyResponseMessage(result, taskKey, language);
        if (friendlyMessage) return friendlyMessage;

        if (taskKey === "taskGetShop" && result.body && typeof result.body === "object" && Array.isArray(result.body.shopConfig)) {
            return translatedLine(language, {zh: "我進來了！", en: "I'm in!"});
        }

        if (result.body && typeof result.body === "object" && Array.isArray(result.body.shopConfig)) {
            const parts = [`shopConfig: ${result.body.shopConfig.length} items`];
            if (result.body.lid !== undefined) parts.push(`lid: ${result.body.lid}`);
            if (result.body.score !== undefined) parts.push(`score: ${result.body.score}`);
            return `HTTP ${result.status} ${parts.join(", ")}`;
        }

        return rawResponseText(result);
    }

        if (!window.confetti) return;

            particleCount: 56,
            spread: 58,

        });

    function App() {
        const [language, setLanguageState] = useState(getInitialLanguage);
        const [humanResponse, setHumanResponse] = useState(getInitialHumanResponse);
        const [uid, setUid] = useState(() => localStorage.getItem(USER_STORAGE_KEY) || "");
        const [giftCode, setGiftCode] = useState("");
        const [results, setResults] = useState([]);

        const [status, setStatus] = useState({state: "idle", key: "ready", params: {}});
        const [cuteLineIndex] = useState(randomCuteLineIndex);
        const [validationLineIndex, setValidationLineIndex] = useState(null);
        const resultsPanelRef = useRef(null);
        const resultsListRef = useRef(null);
        const resultsEndRef = useRef(null);
        const previousResultCountRef = useRef(0);

        const t = useMemo(() => {
            return (key, params = {}) => {
                const template = translations[language][key] || translations.en[key] || key;
                return template.replace(/\{(\w+)\}/g, (_, name) => params[name] ?? "");
            };
        }, [language]);

        useEffect(() => {
            document.documentElement.lang = language === "zh" ? "zh-Hant" : "en";
            localStorage.setItem(LANGUAGE_STORAGE_KEY, language);
        }, [language]);

        useEffect(() => {
            localStorage.setItem(HUMAN_RESPONSE_STORAGE_KEY, humanResponse ? "true" : "false");
        }, [humanResponse]);

        useEffect(() => {
            if (!busy || results.length <= previousResultCountRef.current) {
                previousResultCountRef.current = results.length;
                return;
            }

            requestAnimationFrame(() => {
                const isDesktop = window.matchMedia("(min-width: 768px)").matches;
                if (isDesktop && resultsListRef.current) {
                    resultsListRef.current.scrollTo({
                        top: resultsListRef.current.scrollHeight,
                        behavior: "smooth",
                    });
                    return;
                }

                resultsEndRef.current?.scrollIntoView({behavior: "smooth", block: "end"});
            });

            previousResultCountRef.current = results.length;
        }, [busy, results.length]);

        function setLanguage(nextLanguage) {
            setLanguageState(nextLanguage);
        }

        function updateUid(nextUid) {
            setUid(nextUid);
            localStorage.setItem(USER_STORAGE_KEY, nextUid.trim());
        }

        function requireUserIds() {
            const userIds = parseUserIds(uid);
            if (userIds.length === 0) {
                setStatus({state: "bad", key: "missingUserId", params: {}});
                showValidationMessage();
                return [];
            }
            localStorage.setItem(USER_STORAGE_KEY, userIds.join(", "));
            return userIds;
        }

        function showValidationMessage() {
            setResults([]);
            setValidationLineIndex(randomValidationLineIndex());

        function revealResults() {

            if (result.state === "running") return result.detail || t("waiting");
            if (result.error) return result.error;
            if (result.response) return formatResponse(result.response, result.nameKey, language, humanResponse);
            return result.detail || "";
        }

            const response = await postJson(account.uid, task.url, task.body(account.uid));
            return {response, ok: isSuccessBody(response.body)};
        }

        async function runVipWeekForAccount(account) {
            let okCount = 0;
            let totalCount = 1;
            const statusId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${account.uid}-vip-status`;
            setResults(previous => [...previous, {
                id: statusId,
                accountLabel: accountLabel(account),
                nameKey: "taskVipStatus",
                method: "POST",
                state: "running",
                detail: t("waiting"),
            }]);

            let vipLevel = 1;
            try {
                const response = await postJson(account.uid, `${STORE_ORIGIN}/getvip.php`, {uid: account.uid});
                const ok = isSuccessBody(response.body);
                if (ok) {
                    okCount += 1;
                    vipLevel = chooseVipLevel(response.body, vipLevel);
                }
                setResults(previous => previous.map(result => (
                    result.id === statusId
                        ? {...result, state: ok ? "ok" : "bad", response}
                        : result
                )));
            } catch (error) {
                setResults(previous => previous.map(result => (
                    result.id === statusId ? {...result, state: "bad", error: error.message} : result
                )));
            }

            await wait(450);

            totalCount += 1;
            const resultId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${account.uid}-vip-week`;
            setResults(previous => [...previous, {
                id: resultId,
                accountLabel: accountLabel(account),
                nameKey: "taskVipWeek",
                method: "POST",
                state: "running",
                detail: `vlevel ${vipLevel}`,
            }]);

            try {
                const response = await postJson(account.uid, `${STORE_ORIGIN}/sendvip.php`, {
                    uid: account.uid,
                    vlevel: vipLevel,
                    type: "week",
                    lang: "hk",
                });
                const ok = isSuccessBody(response.body);
                if (ok) {
                    okCount += 1;
                    celebrate();
                }
                setResults(previous => previous.map(result => (
                    result.id === resultId
                        ? {...result, state: ok ? "ok" : "bad", response}
                        : result
                )));
            } catch (error) {
                setResults(previous => previous.map(result => (
                    result.id === resultId ? {...result, state: "bad", error: error.message} : result
                )));
            }

            return {okCount, totalCount};
        }

        async function runDay7TasksForAccount(account) {
            let okCount = 0;
            let totalCount = 1;
            const statusId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${account.uid}-day7-status`;
            setResults(previous => [...previous, {
                id: statusId,
                accountLabel: accountLabel(account),
                nameKey: "taskDay7Status",
                method: "POST",
                state: "running",
                detail: t("waiting"),
            }]);

            let choices = [];
            try {
                const response = await postJson(account.uid, `${STORE_ORIGIN}/getday7.php`, {uid: account.uid});
                const ok = Array.isArray(response.body && response.body.reward);
            if (ok) {
                okCount += 1;
                choices = chooseDay7Rewards(response.body);
            }
                setResults(previous => previous.map(result => (
                    result.id === statusId
                        ? {...result, state: ok ? "ok" : "bad", response}
                        : result
                )));
            } catch (error) {
                setResults(previous => previous.map(result => (
                    result.id === statusId ? {...result, state: "bad", error: error.message} : result
                )));
                return {okCount, totalCount};
            }

            const hasNormalCheckIn = choices.some(choice => choice.dtype === 0);
            if (!hasNormalCheckIn) {
                const doneId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${account.uid}-day7-done`;
                totalCount += 1;
                okCount += 1;
                setResults(previous => [...previous, {
                    id: doneId,
                    accountLabel: accountLabel(account),
                    nameKey: "taskDay7Done",
                    method: "POST",
                    state: "ok",
                    response: {status: 200, body: {code: 0, message: "no status 1 or -1"}},
                }]);
            }

            for (const choice of choices) {
                totalCount += 1;
                const resultId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${account.uid}-day7-${choice.day}-${choice.dtype}`;
                const nameKey = choice.dtype === 1 ? "taskDay7Makeup" : "taskDay7";
                setResults(previous => [...previous, {
                    id: resultId,
                    accountLabel: accountLabel(account),
                    nameKey,
                    method: "POST",
                    state: "running",
                    detail: `day ${choice.day}`,
                }]);

                try {
                    const response = await postJson(account.uid, `${STORE_ORIGIN}/sendday7_new.php`, buildDay7Payload(account.uid, choice.day, choice.dtype));
                    const ok = isSuccessBody(response.body);
                    if (ok) {
                        okCount += 1;
                        celebrate();
                    }
                    setResults(previous => previous.map(result => (
                        result.id === resultId
                            ? {...result, state: ok ? "ok" : "bad", response: {...response, day: choice.day}}
                            : result
                    )));
                } catch (error) {
                    setResults(previous => previous.map(result => (
                        result.id === resultId ? {...result, state: "bad", error: error.message} : result
                    )));
                }

                await wait(450);
            }

            return {okCount, totalCount};
        }

        function accountLabel(account) {
            const displayName = account.name ? `${account.name}` : "";
            const prefix = account.abbr ? `[${account.abbr}] ` : "";
            const namePart = displayName || prefix ? `${prefix}${displayName}` : "";
            return namePart || account.uid;
        }

        function accountFullLabel(account) {
            return `${accountLabel(account)} · ${account.uid}`;
        }

        async function lookupAccount(userId) {
            const id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${userId}-lookup`;
            const fallbackAccount = {uid: userId, name: "", abbr: "", lookupOk: false};
            setResults(previous => [...previous, {
                id,
                accountLabel: userId,
                nameKey: "taskLookupUser",
                method: "POST",
                state: "running",
                detail: t("waiting"),
            }]);

            try {
                const response = await postJson(userId, `${STORE_ORIGIN}/getuserhome.php`, {uid: userId});
                const info = response.body && response.body.info ? response.body.info : {};
                const name = info.name ? info.name : "";
                const abbr = info.abbr ? info.abbr : "";
                const ok = response.body && response.body.code === 0;
                const account = {uid: userId, name, abbr, lookupOk: ok};
                setResults(previous => previous.map(result => (
                    result.id === id
                        ? {
                            ...result,
                            accountLabel: accountLabel(account),
                            state: ok ? "ok" : "bad",
                            detail: ok ? accountFullLabel(account) : "",
                            response: ok ? null : response,
                        }
                        : result
                )));
                return account;
            } catch (error) {
                setResults(previous => previous.map(result => (
                    result.id === id
                        ? {...result, state: "bad", error: error.message}
                        : result
                )));
                return fallbackAccount;
            }
        }

        async function runWebsiteTasks() {
            const userIds = requireUserIds();
            if (userIds.length === 0) return;

            setBusy(true);
            setResults([]);
            setValidationLineIndex(null);
            previousResultCountRef.current = 0;
            setStatus({state: "running", key: "runningTasks", params: {}});
            revealResults();

            let okCount = 0;
            let totalCount = 0;
            for (const userId of userIds) {
                const account = await lookupAccount(userId);
                totalCount += 1;
                if (account.lookupOk) okCount += 1;

                for (const task of taskDefinitions) {
                    if (task.nameKey === "taskDay7") {
                        const day7Result = await runDay7TasksForAccount(account);
                        okCount += day7Result.okCount;
                        totalCount += day7Result.totalCount;
                        await wait(450);
                        continue;
                    }

                    if (task.nameKey === "taskVipWeek") {
                        const vipResult = await runVipWeekForAccount(account);
                        okCount += vipResult.okCount;
                        totalCount += vipResult.totalCount;
                        await wait(450);
                        continue;
                    }

                    totalCount += 1;
                    const id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${account.uid}-${task.nameKey}`;
                    const pendingResult = {
                        id,
                        accountLabel: accountLabel(account),
                        nameKey: task.nameKey,
                        method: task.method,
                        state: "running",
                        detail: t("waiting"),
                    };
                    setResults(previous => [...previous, pendingResult]);

                    try {
                        const {response, ok} = await runTaskForAccount(account, task, id);
                        if (ok) {
                            okCount += 1;
                            celebrate();
                        }
                        setResults(previous => previous.map(result => (
                            result.id === id
                                ? {...result, state: ok ? "ok" : "bad", response}
                                : result
                        )));
                    } catch (error) {
                        setResults(previous => previous.map(result => (
                            result.id === id
                                ? {...result, state: "bad", error: error.message}
                                : result
                        )));
                    }

                    await wait(450);
                }
            }

            setStatus({
                state: okCount === totalCount ? "ok" : "bad",
                key: "done",
                params: {ok: okCount, total: totalCount},
            });
            setBusy(false);
        }

        async function redeemGiftCode() {
            const userIds = requireUserIds();
            const cleanCode = giftCode.trim();
            if (userIds.length === 0) return;
            if (!cleanCode) {
                setStatus({state: "bad", key: "missingInput", params: {}});
                showValidationMessage();
                return;
            }

            setBusy(true);
            setResults([]);
            setValidationLineIndex(null);
            previousResultCountRef.current = 0;
            setStatus({state: "running", key: "redeeming", params: {}});
            revealResults();

            let okCount = 0;
            const totalCount = userIds.length * 2;
            for (const userId of userIds) {
                const account = await lookupAccount(userId);
                if (account.lookupOk) okCount += 1;

                const url = new URL(`${GIFT_ORIGIN}/code.php`);
                url.searchParams.set("uid", account.uid);
                url.searchParams.set("code", cleanCode);

                const id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${account.uid}-gift`;
                setResults(previous => [...previous, {
                    id,
                    accountLabel: accountLabel(account),
                    nameKey: "taskRedeemGift",
                    method: "GET",
                    state: "running",
                    detail: t("waiting"),
                }]);

                try {
                    const response = await getJson(account.uid, url.toString());
                    const ok = response.body && response.body.errorCode === "ok";
                    if (ok) {
                        okCount += 1;
                        celebrate();
                    }
                    setResults(previous => previous.map(result => (
                        result.id === id
                            ? {...result, state: ok ? "ok" : "bad", response}
                            : result
                    )));
                } catch (error) {
                    setResults(previous => previous.map(result => (
                        result.id === id ? {...result, state: "bad", error: error.message} : result
                    )));
                }

                await wait(450);
            }

            setStatus({state: okCount === totalCount ? "ok" : "bad", key: okCount === totalCount ? "redeemed" : "failed", params: {}});
            setBusy(false);
        }

                                    detail: resultDetail(result),
                                })),
                            h("div", {ref: resultsEndRef, "aria-hidden": true}),
                        ),
                    ),
                ),
            ),
        );
    }

    const inputClassName = "min-h-11 w-full rounded-md border border-line bg-white px-3 text-ink outline-none transition focus:border-brand focus:ring-4 focus:ring-brand/15";
    const primaryButtonClassName = "inline-flex min-h-[46px] items-center justify-center gap-2 rounded-md bg-brand px-4 font-extrabold text-white transition hover:-translate-y-0.5 hover:bg-brand/95 disabled:cursor-not-allowed disabled:opacity-55 disabled:hover:translate-y-0";
    const secondaryButtonClassName = "inline-flex min-h-[46px] items-center justify-center gap-2 rounded-md border border-brand/35 bg-brandSoft px-4 font-extrabold text-brand transition hover:-translate-y-0.5 hover:bg-brandSoft/75 disabled:cursor-not-allowed disabled:opacity-55 disabled:hover:translate-y-0";

    function Panel({title, meta, actions, children}) {
        return h("div", {className: "overflow-hidden rounded-lg border border-line bg-white/70 shadow-soft"},
            h("div", {className: "flex flex-wrap items-center justify-between gap-3 border-b border-line bg-panelSoft px-[18px] py-4"},
                h("h2", {className: "m-0 text-base font-extrabold leading-tight tracking-normal"}, title),
                h("div", {className: "flex flex-wrap items-center justify-end gap-3"},
                    meta ? h("span", {className: "text-xs font-extrabold text-muted"}, meta) : null,
                    actions || null,
                ),
            ),
            children,
        );
    }

    function HumanResponseToggle({label, checked, onChange}) {
        return h("label", {className: "inline-flex cursor-pointer items-center gap-2 rounded-full border border-brand/25 bg-white px-2.5 py-1 text-xs font-extrabold text-brand shadow-sm"},
            h("input", {
                type: "checkbox",
                checked,
                onChange: event => onChange(event.target.checked),
                className: "h-4 w-4 accent-brand",
            }),
            h("span", null, label),
        );
    }

    function Field({label, htmlFor, children}) {
        return h("div", {className: "grid gap-2"},
            h("label", {htmlFor, className: "text-[13px] font-bold text-muted"}, label),
            children,
        );
    }

    function EmptyState({label}) {
        return h("div", {className: "grid min-h-80 place-items-center p-8 text-center text-muted"},
            h("div", null,
                h("div", {className: "mx-auto mb-4 grid h-[76px] w-[76px] animate-catFloat place-items-center rounded-lg border border-line bg-brandSoft text-brand"},
                    h(Icon, {icon: "fa6-solid:cat", className: "h-11 w-11"}),
                ),
                h("div", null, label),
            ),
        );
    }

    function ResultItem({result, name, detail}) {
        return h("article", {className: "grid animate-resultIn grid-cols-[28px_minmax(0,1fr)_auto] items-center gap-2.5 rounded-lg border border-line bg-white p-3"},
            h("div", {className: `grid h-[26px] w-[26px] place-items-center rounded-full text-white ${badgeClass(result.state)}`}, stateIcon(result.state)),
            h("div", null,
                result.accountLabel
                    ? h("p", {className: "mb-1 break-words text-[11px] font-extrabold leading-tight text-brand"}, result.accountLabel)
                    : null,
                h("p", {className: "m-0 text-sm font-extrabold leading-tight"}, name),
                h("p", {className: "mt-1 break-words font-mono text-xs leading-relaxed text-muted"}, detail),
            ),
            h("span", {className: "text-xs font-extrabold text-muted"}, result.method),
        );
    }

    function badgeClass(state) {
        if (state === "ok") return "bg-brand";
        if (state === "bad") return "bg-danger";
        return "bg-brand";
    }

    function stateIcon(state) {
        if (state === "ok") return h(Icon, {icon: "mdi:check-bold", className: "h-4 w-4"});
        if (state === "bad") return h(Icon, {icon: "mdi:exclamation-thick", className: "h-4 w-4"});
        return h(Icon, {icon: "mdi:dots-horizontal", className: "h-4 w-4"});
    }

    createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
