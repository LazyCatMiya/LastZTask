apiVersion: batch/v1
kind: CronJob
metadata:
  name: last-daily-tasks
spec:
  schedule: "30 10 * * *"
  timeZone: "Asia/Taipei"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: last-daily-tasks
              image: __IMAGE__
              imagePullPolicy: Always
              args:
                - "--insecure"
                - "--quiet"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
